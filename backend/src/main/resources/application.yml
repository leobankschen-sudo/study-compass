spring:
  application:
    name: study-compass-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/study_compass?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

server:
  port: ${SERVER_PORT:8080}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

logging:
  level:
    com.zhixu.studycompass.mapper: info

security:
  jwt:
    secret: ${JWT_SECRET:study-compass-local-jwt-secret-2026-change-me-now}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

app:
  demo-account:
    enabled: ${DEMO_ACCOUNT_ENABLED:true}
    password: ${DEMO_ACCOUNT_PASSWORD:Study2026}
  deepseek:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
